<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="min-h-screen bg-[#f7f6fb] font-['Inter'] text-[#16142a] antialiased">
    <!-- Header -->
    <header class="px-3 pt-3">
      <nav class="relative mx-auto max-w-6xl rounded-full bg-white px-8 py-4 shadow-sm md:px-12">
        <input id="menu-toggle" type="checkbox" class="peer sr-only" aria-label="Toggle menu" />
        <div class="flex items-center justify-between">
          <a href="#home" class="text-xl font-bold tracking-tight">
            Acme<span class="align-super text-[10px] leading-none text-[#5e44ff]">●</span>
          </a>

          <ul class="hidden items-center gap-10 text-xs font-medium md:flex">
            <li><a href="#home" class="text-[#5b3df5] underline underline-offset-4">Home</a></li>
            <li><a href="#features" class="hover:text-[#5b3df5]">Features</a></li>
            <li><a href="#pricing" class="hover:text-[#5b3df5]">Pricing</a></li>
            <li><a href="#contact" class="hover:text-[#5b3df5]">Contact</a></li>
          </ul>

          <label
            for="menu-toggle"
            class="cursor-pointer rounded-md p-1.5 text-slate-600 hover:bg-slate-100 md:hidden"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </label>
        </div>

        <!-- Mobile dropdown (CSS only: shown when the checkbox above is checked) -->
        <ul
          class="absolute left-0 right-0 top-full mt-2 hidden rounded-2xl bg-white py-3 text-center text-sm font-medium shadow-lg peer-checked:block md:!hidden"
        >
          <li><a href="#home" class="block py-2 text-[#5e44ff]">Home</a></li>
          <li><a href="#features" class="block py-2">Features</a></li>
          <li><a href="#pricing" class="block py-2">Pricing</a></li>
          <li><a href="#contact" class="block py-2">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Hero -->
      <section id="home" class="mx-auto max-w-4xl px-4 pb-16 pt-20 text-center md:pt-24">
        <span
          class="inline-flex items-center gap-1.5 rounded-full bg-violet-200/70 px-3 py-1 text-[11px] font-medium text-[#3b2a99]"
        >
          🚀 Acme Productivity App
        </span>

        <h1 class="mt-6 text-5xl font-extrabold leading-tight tracking-tight sm:text-6xl md:text-7xl">
          Boost Your <span class="text-[#5e44ff]">Product</span>ivity
        </h1>

        <p class="mx-auto mt-5 max-w-xl text-base font-semibold md:text-lg">
          Streamline your workflow with our all-in-one productivity app.
        </p>

        <a
          href="#contact"
          class="mt-8 inline-block rounded-lg bg-[#16142a] px-6 py-3 text-xs font-semibold text-white transition hover:bg-slate-700"
        >
          Start Free Trial
        </a>
      </section>
      
    </main>
  </body>
</html>
